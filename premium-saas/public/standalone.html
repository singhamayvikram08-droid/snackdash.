    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      }

      playKey() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1400 + Math.random() * 200, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch (e) {}
      }

      playSuccess() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.03, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.12);
          });
        } catch (e) {}
      }

      playNodeSelect() {
        if (this.muted) return;

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch (e) {}

          osc.start();
          osc.stop(this.ctx.currentTime + 0.4);
        } catch (e) {}
      }

    function NeuralEngineView({ onSelectNode }) {
      const containerRef = useRef(null);
      const [selectedNodeData, setSelectedNodeData] = useState(null);
      const [hexStream, setHexStream] = useState([]);
      const [fps, setFps] = useState(60);

        const interval = setInterval(() => {
          const codes = Array.from({ length: 8 }, () => '0x' + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0'));
          setHexStream(codes);
        }, 120);
        return () => clearInterval(interval);
      }, []);

      // Three.js Canvas Mount

        const container = containerRef.current;
        if (!container || !window.THREE) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030307, 0.035);

        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 2, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Core Quantum Hulls
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Inner Icosahedron
        const icoGeo = new THREE.IcosahedronGeometry(2.0, 1);
        const icoMat = new THREE.MeshBasicMaterial({
          color: 0x00f3ff,
          wireframe: true,
          transparent: true,
          opacity: 0.6
        });
        const icoMesh = new THREE.Mesh(icoGeo, icoMat);
        coreGroup.add(icoMesh);

        // Outer Dodecahedron Hull
        const dodecaGeo = new THREE.DodecahedronGeometry(2.7, 0);
        const dodecaMat = new THREE.MeshBasicMaterial({
          color: 0x8b5cf6,
          wireframe: true,
          transparent: true,
          opacity: 0.25
        });
        const dodecaMesh = new THREE.Mesh(dodecaGeo, dodecaMat);
        coreGroup.add(dodecaMesh);

        // Glowing Center Point Light
        const light = new THREE.PointLight(0x00f3ff, 2.5, 30);
        coreGroup.add(light);

        // Orbital Ring
        const ringGeo = new THREE.TorusGeometry(4.8, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.2 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // Satellite Neural Nodes
        const satelliteNodes = [];
        const nodeCount = 8;
        const nodeInfo = [
          { name: 'Core Alpha', tensor: '[1024, 768]', tput: '384 GB/s', ping: '0.18ms', state: 'Active' },
          { name: 'Transformer β', tensor: '[2048, 2048]', tput: '512 GB/s', ping: '0.24ms', state: 'Active' },

          { name: 'Latent Matrix δ', tensor: '[4096, 512]', tput: '420 GB/s', ping: '0.15ms', state: 'Active' },
          { name: 'Edge Buffer ε', tensor: '[128, 64]', tput: '96 GB/s', ping: '0.09ms', state: 'Standby' },
          { name: 'Kernel Dispatch ζ', tensor: '[1024, 1024]', tput: '256 GB/s', ping: '0.28ms', state: 'Active' },
          { name: 'Quantum Shuffler η', tensor: '[512, 512]', tput: '310 GB/s', ping: '0.19ms', state: 'Active' },
          { name: 'Synaptic Bridge θ', tensor: '[2048, 1024]', tput: '480 GB/s', ping: '0.22ms', state: 'Active' }
        ];

        const nodeGroup = new THREE.Group();
        scene.add(nodeGroup);

        for (let i = 0; i < nodeCount; i++) {
          const angle = (i / nodeCount) * Math.PI * 2;
          const radius = 4.8;
          const sphereGeo = new THREE.SphereGeometry(0.24, 16, 16);
          const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
          const sphere = new THREE.Mesh(sphereGeo, sphereMat);
          sphere.position.set(Math.cos(angle) * radius, (Math.sin(i * 1.5) * 1.2), Math.sin(angle) * radius);

          nodeGroup.add(sphere);
          satelliteNodes.push(sphere);

          // Conduit Line connecting to core
          const lineMat = new THREE.LineBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.25 });
          const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), sphere.position]);
          const line = new THREE.Line(lineGeo, lineMat);
          scene.add(line);
        }

        // Ambient Volumetric Dust Particles
        const particleGeo = new THREE.BufferGeometry();
        const pCount = 800;
        const positions = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i += 3) {

        let mouseX = 0, mouseY = 0;

          if (isDragging) {
            const deltaX = e.clientX - prevMouseX;
            const deltaY = e.clientY - prevMouseY;
            targetRotationY += deltaX * 0.005;
            targetRotationX += deltaY * 0.005;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
          }
        };

        const onMouseUp = () => { isDragging = false; };

        // Raycasting for node clicks
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onClick = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(satelliteNodes);

          if (intersects.length > 0) {
            const node = intersects[0].object.userData;
            setSelectedNodeData(node);
            sound.playNodeSelect();
            if (onSelectNode) onSelectNode(node);
          }
        };

        container.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        container.addEventListener('click', onClick);

        // Animation Loop
        let animationFrameId;
        let lastTime = performance.now();
        let frameCount = 0;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          // Rotate Cores
          icoMesh.rotation.x += 0.005;
          icoMesh.rotation.y += 0.008;
          dodecaMesh.rotation.x -= 0.003;
          dodecaMesh.rotation.y -= 0.005;

          // Orbit Core Group smoothly based on user drag
          coreGroup.rotation.y += (targetRotationY - coreGroup.rotation.y) * 0.05;
          coreGroup.rotation.x += (targetRotationX - coreGroup.rotation.x) * 0.05;
          nodeGroup.rotation.y = coreGroup.rotation.y;
          nodeGroup.rotation.x = coreGroup.rotation.x;

          // Pulse Satellite Nodes
          const time = Date.now() * 0.002;
          satelliteNodes.forEach((node, idx) => {
            node.position.y += Math.sin(time + idx) * 0.003;
          });

          // FPS calculation
          frameCount++;
          const curTime = performance.now();
          if (curTime - lastTime >= 1000) {
            setFps(Math.round((frameCount * 1000) / (curTime - lastTime)));
            frameCount = 0;
            lastTime = curTime;
          }

          renderer.render(scene, camera);
        };

        animate();

        // Responsive Resize
        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          container.removeEventListener('click', onClick);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return (
        <div className="relative w-full h-[640px] lg:h-[720px] rounded-3xl overflow-hidden glass-card glass-card-cyan border border-[#00f3ff]/20">
          {/* Three.js Canvas Container */}
          <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />

          {/* Top Telemetry Overlay */}
          <div className="absolute top-6 left-6 right-6 flex flex-wrap items-center justify-between gap-4 pointer-events-none">
            <div className="flex items-center gap-3 bg-[#030307]/80 backdrop-blur-md px-4 py-2 rounded-xl border border-[#00f3ff]/30">
              <span className="w-2.5 h-2.5 rounded-full bg-[#00f3ff] animate-ping" />

            <div className="flex items-center gap-3">
              <div className="bg-[#030307]/80 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 font-mono text-xs">

              </div>
              <div className="bg-[#030307]/80 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 font-mono text-xs">

                        activeTab === tab.id
                          ? 'bg-[#00f3ff] text-black shadow-[0_0_20px_rgba(0,243,255,0.4)]'
                          : 'text-gray-400 hover:text-white hover:bg-white/5'
                      }`}
                    >
                      <Icon className="w-3.5 h-3.5" />
                      {tab.label}
                    </button>
                  );
                })}
              </nav>

              {/* Action Buttons */}
              <div className="flex items-center gap-3">
                <button
                  onClick={toggleSound}
                  aria-label="Toggle Sound Effects"
                  className="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-[#00f3ff] border border-white/10 transition-colors"
                >
                  {muted ? <Icons.VolumeX className="w-4 h-4 text-rose-400" /> : <Icons.Volume2 className="w-4 h-4 text-emerald-400" />}
                </button>

                <button
                  onClick={() => {
                    sound.playSuccess();
                    alert('Connecting to WebGPU Hardware Accelerators on localhost...');
                  }}
                  className="px-4 py-2 rounded-xl bg-gradient-to-r from-[#00f3ff] to-[#8b5cf6] text-black font-space font-bold text-xs uppercase tracking-wider hover:opacity-90 active:scale-95 transition-all shadow-[0_0_20px_rgba(0,243,255,0.25)]"
                >
                  Deploy Core
                </button>
              </div>
            </div>

            {/* Mobile Tab Scroller */}
            <div className="flex md:hidden gap-1 mt-3 overflow-x-auto pb-1">
              {[
                { id: 'engine', label: '3D Engine' },
                { id: 'nodes', label: 'Fleet' },
                { id: 'console', label: 'Console' },
                { id: 'pricing', label: 'Pricing' },
                { id: 'security', label: 'Security' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { sound.playClick(); setActiveTab(tab.id); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-space font-bold whitespace-nowrap ${
                    activeTab === tab.id ? 'bg-[#00f3ff] text-black' : 'text-gray-400 bg-white/5'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Content View Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8 space-y-8">
            {activeTab === 'engine' && <NeuralEngineView />}
            {activeTab === 'nodes' && <EdgeFleetView />}
            {activeTab === 'console' && <ConsoleView />}
            {activeTab === 'pricing' && <PricingCalculatorView />}
            {activeTab === 'security' && <SecurityShieldView />}
          </main>

          {/* Footer */}
          <footer className="border-t border-white/10 bg-[#030307] py-6 px-6 text-center text-xs font-mono text-gray-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <span>NEXGEN SPATIAL COMPUTING ENGINE · DISTRIBUTED WEBGPU MESH</span>
              <div className="flex items-center gap-4">
                <span className="text-emerald-400">● 312 NODES HEALTHY</span>
                <span>LATENCY: 0.32ms</span>
                <span>QUANTUM ENCRYPTED</span>
              </div>
            </div>
          </footer>

          {/* Persistent Nex AI Assistant Floating Drawer */}
          <NexAIAssistant />
        </div>
      );
    }

    // Mount Root Component
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
