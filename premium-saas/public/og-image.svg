<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#030305"/>
  <defs>
    <radialGradient id="grad1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030305" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#a200ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030305" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a200ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>

  <!-- Grid overlay -->
  <g opacity="0.15" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <polygon points="40,0 80,23 80,69 40,92 0,69 0,23" fill="none" stroke="#00f0ff" stroke-width="6"/>
    <polygon points="40,15 65,30 65,60 40,75 15,60 15,30" fill="#a200ff" opacity="0.6"/>
    <text x="110" y="65" font-family="Inter, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">
      NEX<tspan fill="#00f0ff">GEN</tspan>
    </text>
    <rect x="330" y="28" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.4"/>
    <text x="395" y="50" font-family="monospace" font-size="12" fill="#00f0ff" text-anchor="middle" font-weight="bold" letter-spacing="2">
      CORE v2.4
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="280" font-family="Poppins, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    VIRTUALIZE REALITY.
  </text>
  <text x="100" y="350" font-family="Poppins, sans-serif" font-weight="900" font-size="64" fill="url(#textGrad)" letter-spacing="-1">
    3D AUTONOMOUS ENGINE.
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="Inter, sans-serif" font-weight="400" font-size="22" fill="#9ca3af">
    The world's first synchronized spatial development engine with sub-millisecond edge latency.
  </text>

  <!-- Metrics Badges -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="220" height="70" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="32" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af" font-weight="bold" letter-spacing="1">LATENCY</text>
    <text x="24" y="58" font-family="Inter, sans-serif" font-size="24" fill="#00f0ff" font-weight="900">&lt; 0.86ms</text>

    <rect x="240" y="0" width="220" height="70" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="264" y="32" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af" font-weight="bold" letter-spacing="1">THROUGHPUT</text>
    <text x="264" y="58" font-family="Inter, sans-serif" font-size="24" fill="#a200ff" font-weight="900">1.24 TB/s</text>

    <rect x="480" y="0" width="220" height="70" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="504" y="32" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af" font-weight="bold" letter-spacing="1">EDGE NODES</text>
    <text x="504" y="58" font-family="Inter, sans-serif" font-size="24" fill="#27c93f" font-weight="900">14,029 Active</text>
  </g>
</svg>
