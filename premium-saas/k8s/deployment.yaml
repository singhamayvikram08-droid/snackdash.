apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexgen-ai-pro-deployment
  namespace: production
  labels:
    app.kubernetes.io/name: nexgen-ai-pro
    app.kubernetes.io/instance: nexgen-prod-01
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/component: neural-spatial-core
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexgen-ai-pro
  template:
    metadata:
      labels:
        app: nexgen-ai-pro
    spec:
      containers:
        - name: nexgen-ai-core
          image: ghcr.io/nexgen-ai/spatial-core:2.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-edge
              containerPort: 5173
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5173"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexgen-secrets
                  key: openrouter-key

          # ─────────────────────────────────────────────────────────────
          # 1. STARTUP PROBE
          # Protects slow-starting containers by giving them up to 60s
          # (period 3s * failureThreshold 20) to bootstrap before liveness begins.
          # ─────────────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /api/health/startup
              port: http-edge
              httpHeaders:
                - name: X-Kubernetes-Probe
                  value: StartupCheck
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
            successThreshold: 1

          # ─────────────────────────────────────────────────────────────
          # 2. LIVENESS PROBE
          # Detects unrecoverable deadlocks, memory exhaustion, or crashes.
          # If this probe fails 3 consecutive times, kubelet restarts the container.
          # ─────────────────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: http-edge
              httpHeaders:
                - name: X-Kubernetes-Probe
                  value: LivenessCheck
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ─────────────────────────────────────────────────────────────
          # 3. READINESS PROBE
          # Detects temporary unavailability (e.g. rate limits, draining traffic).
          # If this probe fails, the Pod is immediately removed from Service endpoints
          # so no client traffic is routed to it until it recovers.
          # ─────────────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: http-edge
              httpHeaders:
                - name: X-Kubernetes-Probe
                  value: ReadinessCheck
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: nexgen-ai-pro-service
  namespace: production
  labels:
    app: nexgen-ai-pro
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http-edge
  selector:
    app: nexgen-ai-pro

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexgen-ai-pro-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexgen-ai-pro-deployment
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
